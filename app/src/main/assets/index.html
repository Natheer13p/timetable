<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<title>جدول الحصص</title>
<style>
:root{--bg:#eef0ff;--card:#fff;--tx:#1e1b4b;--mut:#6366a8;--ac:#4f46e5;--ac2:#7c3aed;--hd:#e0e3ff;--ln:#c7cbf5;--now:#fde68a;--al:#be185d;--cell:#f7f8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d2e;--card:#1a1748;--tx:#e8e9ff;--mut:#a5a8e8;--ac:#818cf8;--ac2:#a78bfa;--hd:#262366;--ln:#3a3787;--now:#6b5a14;--al:#f9a8d4;--cell:#1f1c55}}
:root[data-theme="dark"]{--bg:#0f0d2e;--card:#1a1748;--tx:#e8e9ff;--mut:#a5a8e8;--ac:#818cf8;--ac2:#a78bfa;--hd:#262366;--ln:#3a3787;--now:#6b5a14;--al:#f9a8d4;--cell:#1f1c55}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#1e1b4b,#4338ca 55%,#7c3aed);color:#fff;text-align:center;padding:12px 10px;border-radius:0 0 22px 22px;box-shadow:0 4px 16px rgba(67,56,202,.35)}
h1{margin:0;font-size:18px}
.bar{display:flex;gap:8px;padding:8px 8px 4px}
button{font:inherit;border:0;border-radius:12px;padding:9px 12px;cursor:pointer;background:var(--hd);color:var(--tx)}
button.main{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:bold;flex:1}
button.on{background:linear-gradient(135deg,#059669,#10b981)}
#next{margin:2px 8px 6px;padding:7px;border-radius:12px;background:var(--card);border:1px solid var(--ln);font-size:13px;text-align:center}
.wrap{flex:1;min-height:0;margin:0 6px 8px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:var(--card)}
table{border-collapse:collapse;width:100%;height:100%;table-layout:fixed}
th,td{border:1px solid var(--ln);text-align:center;padding:1px;overflow:hidden}
th{background:linear-gradient(180deg,var(--hd),var(--card));font-weight:normal;height:64px}
th .n{display:block;font-size:17px;font-weight:bold;color:var(--ac)}
th .t{display:block;font-size:9px;color:var(--mut);direction:ltr;line-height:1.3}
th .a{display:block;font-size:9px;color:var(--al);font-weight:bold}
td.day,th.dh{width:15%}
td.day{background:linear-gradient(180deg,var(--ac),var(--ac2));color:#fff;font-weight:bold;font-size:12px}
td.day.today{outline:3px solid #fbbf24;outline-offset:-3px}
td.c{background:var(--cell);font-size:11.5px;line-height:1.35;font-weight:600;cursor:pointer;word-break:break-word}
td.c.empty{color:var(--ln);font-size:16px}
td.c.now{background:var(--now)}
td.c:active{filter:brightness(.9)}
#m{position:fixed;inset:0;background:rgba(15,13,46,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
#m.show{display:flex}
.box{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.box h2{margin:0 0 10px;font-size:16px;text-align:center;color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.g button{padding:11px 2px;font-size:13px}
.cu{display:flex;gap:8px;margin:8px 0}
input{flex:1;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);min-width:0}
.del{background:#dc2626;color:#fff}
</style>
</head>
<body>
<header><h1>جدول الحصص — اعدادية العبيدي للبنين</h1></header>
<div class="bar">
<button class="main" id="en">🔔 تفعيل الصوت والإشعارات</button>
<button id="test">تجربة</button>
</div>
<div id="next"></div>
<div class="wrap"><table id="tb"></table></div>

<div id="m"><div class="box">
<h2 id="mt"></h2>
<div class="g" id="opts"></div>
<div class="cu"><input id="cust" placeholder="اسم آخر..."><button class="main" id="sv" style="flex:none">حفظ</button></div>
<div class="g" style="grid-template-columns:1fr 1fr"><button class="del" id="dl">حذف الحصة</button><button id="cl">إلغاء</button></div>
</div></div>

<script>
var DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"];
var LES=[
{s:"8:15",e:"9:00",a:"8:10",n:"الأول"},
{s:"9:05",e:"9:50",a:"9:00",n:"الثاني"},
{s:"10:00",e:"10:45",a:"9:55",n:"الثالث"},
{s:"10:50",e:"11:30",a:"10:45",n:"الرابع"},
{s:"11:35",e:"12:15",a:"11:30",n:"الخامس"},
{s:"12:20",e:"1:00",a:"12:15",n:"السادس"}];
var CL=["رابع علمي أ","رابع علمي ب","رابع علمي ج","رابع أدبي","خامس علمي أ","خامس علمي ب","خامس علمي ج","خامس أدبي","سادس علمي أ","سادس علمي ب","سادس علمي ج","سادس أدبي"];
var A="رابع علمي أ",B="رابع علمي ب",C="رابع علمي ج",D="خامس علمي أ",E="خامس علمي ب",F="خامس علمي ج";
var DEF=[
["","","",E,A,B],
[B,D,"",F,"",A],
[F,D,C,"",B,""],
["",E,C,"",A,F],
[E,C,"","","",D]];
var KEY="obaidi_tt_v2",data,sel=null,fired={};
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
var AM=[490,540,595,645,690,735],LN=["الأول","الثاني","الثالث","الرابع","الخامس","السادس"];
function sync(){if(!window.Native)return;var a=[];for(var r=0;r<5;r++)for(var c=0;c<6;c++)if(data[r][c])a.push({d:r,c:c,m:AM[c],t:"الدرس "+LN[c]+" بعد خمس دقائق، "+data[r][c]});try{Native.schedule(JSON.stringify(a))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}sync()}
data=load();
function mins(t){var p=t.split(":"),h=+p[0];if(h<7)h+=12;return h*60+ +p[1]}
function render(){
var h="<tr><th class='dh'></th>";
LES.forEach(function(l,i){h+="<th><span class='n'>"+(i+1)+"</span><span class='t'>"+l.s+"–"+l.e+"</span><span class='a'>🔔 "+l.a+"</span></th>"});
h+="</tr>";
var now=new Date(),d=now.getDay(),nm=now.getHours()*60+now.getMinutes();
DAYS.forEach(function(dn,r){
h+="<tr><td class='day"+(r===d?" today":"")+"'>"+dn+"</td>";
LES.forEach(function(l,c){
var v=data[r][c],cur=(r===d&&nm>=mins(l.s)&&nm<mins(l.e));
h+="<td class='c"+(v?"":" empty")+(cur?" now":"")+"' data-r='"+r+"' data-c='"+c+"'>"+(v?v:"＋")+"</td>"});
h+="</tr>"});
document.getElementById("tb").innerHTML=h;
nextInfo()}
function nextInfo(){
var now=new Date(),d=now.getDay(),nm=now.getHours()*60+now.getMinutes(),el=document.getElementById("next");
if(d<=4){for(var c=0;c<6;c++){if(data[d][c]&&mins(LES[c].s)>=nm){el.textContent="القادمة: الدرس "+LES[c].n+" — "+data[d][c]+" — "+LES[c].s;return}}}
el.textContent="لا توجد حصص قادمة اليوم"}
document.getElementById("tb").addEventListener("click",function(e){
var td=e.target.closest("td.c");if(!td)return;
sel={r:+td.dataset.r,c:+td.dataset.c};
document.getElementById("mt").textContent=DAYS[sel.r]+" — الدرس "+LES[sel.c].n;
document.getElementById("cust").value="";
document.getElementById("m").classList.add("show")});
var og=document.getElementById("opts");
CL.forEach(function(n){var b=document.createElement("button");b.textContent=n;b.onclick=function(){setCell(n)};og.appendChild(b)});
function setCell(v){if(!sel)return;data[sel.r][sel.c]=v;save();closeM();render()}
function closeM(){document.getElementById("m").classList.remove("show")}
document.getElementById("sv").onclick=function(){var v=document.getElementById("cust").value.trim();if(v)setCell(v)};
document.getElementById("dl").onclick=function(){setCell("")};
document.getElementById("cl").onclick=closeM;
document.getElementById("m").onclick=function(e){if(e.target.id==="m")closeM()};

var ctx=null;
function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();
[0,.3,.6].forEach(function(t,i){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=i===2?1046:784;o.type="sine";
g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.5,ctx.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.26);
o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.28)})}catch(e){}}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.9;speechSynthesis.cancel();setTimeout(function(){speechSynthesis.speak(u)},900)}catch(e){}}
function notify(t){try{if("Notification" in window&&Notification.permission==="granted")new Notification("⏰ تنبيه حصة",{body:t})}catch(e){}
try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function alertNow(c,v){var m="الدرس "+LES[c].n+" بعد خمس دقائق، "+v;beep();speak(m);notify(m)}
function enOn(){var b=document.getElementById("en");b.textContent="✅ التنبيهات مفعّلة";b.classList.add("on")}
document.getElementById("en").onclick=function(){
beep();
try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
try{if("Notification" in window&&Notification.permission==="default"){Notification.requestPermission().then(enOn)}else enOn()}catch(e){enOn()}};
document.getElementById("test").onclick=function(){if(window.Native)Native.test();else alertNow(0,"خامس علمي ب")};
function tick(){
var n=new Date(),d=n.getDay();
if(d<=4&&!window.Native){var hm=n.getHours()*60+n.getMinutes(),day=n.toDateString();
for(var c=0;c<6;c++){if(mins(LES[c].a)===hm&&data[d][c]){var k=day+c;if(!fired[k]){fired[k]=1;alertNow(c,data[d][c])}}}}
render()}
if(window.Native){document.getElementById("en").style.display="none"}sync();setInterval(tick,10000);render();tick();
try{if(Notification.permission==="granted")enOn()}catch(e){}
</script>
</body>
</html>
